<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <style>
      body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-image: url('https://i.pinimg.com/originals/08/42/4d/08424d7de0893189bf2047184a2421f5.gif');
    background-size: contain; /* Adjusted */
    background-repeat: no-repeat; /* Prevents the image from repeating */
    background-position: center;
    background-color:black;
    display: flex;
    justify-content: center;
   
    height: 100vh;
    color:#BF00FF;
  }

  .loading-text {
    font-size: 30px;
    animation: appear 0.1s forwards;
    opacity: 0;
  }

  @keyframes appear {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }

  @keyframes letter {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }
  </style>
</head>
<body>
  <div class="loading-text" id="loadingText"></div>

  <script>
    const loadingText = document.getElementById('loadingText');
    const text = ' ✦•·········•✦•·········•✦Loading  ✦•·········•✦•·········•✦';
    let index = 0;

    function animateText() {
      if (index < text.length) {
        loadingText.innerHTML += `<span class="letter-animation">${text.charAt(index)}</span>`;
        index++;
        setTimeout(animateText, 40);
      }
    }

    animateText();

    setTimeout(() => {
      window.location.href = '/login'; // Redirect to your login page after 5 seconds
    }, 6000);
  </script>
</body>
</html>
